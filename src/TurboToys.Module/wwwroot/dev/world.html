<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8" />
    <!-- preview of a world (also linked from the admin): dev/world.html?layout=kidsroom&time=day&view=top|chase|orbit&quality=high&at=0.1&speed=0 (speed > 0: a ride along the track);
         ?track=<id> instead of layout shows a custom track (its design from api/tracks/{id}/design) -->
    <base href="/turbotoys/" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <title>TurboToys · Welt-Vorschau</title>
    <style>
        @font-face { font-family: Bangers; src: url(fonts/bangers-latin-400-normal.woff2) format('woff2'); }
        html, body { margin: 0; height: 100%; background: #111; overflow: hidden; font-family: sans-serif; }
        #stage { position: fixed; inset: 0; }
        #info { position: fixed; left: 8px; top: 8px; color: #fff; background: rgba(0,0,0,.55); padding: 6px 10px; font: 13px monospace; z-index: 2; }
    </style>
    <script type="importmap">{ "imports": { "three": "./lib/three/three.module.js" } }</script>
</head>
<body>
<div id="stage"></div>
<div id="info">lädt …</div>
<script type="module">
    import * as THREE from 'three';
    import { buildWorld } from './js/game/world.js';
    import { ComicPipeline } from './js/game/render/postfx.js';

    const q = new URLSearchParams(location.search);
    // a custom track (admin preview: ?track=<id>) comes as a design from the API, an official one is a key of data/layouts.json
    const trackId = q.get('track');
    const json = q.get('json'); // a layout file (editor experiments)
    const layout = json ? await fetch(json).then(r => r.json()) : trackId ? await fetch(`api/tracks/${encodeURIComponent(trackId)}/design`, { credentials: 'include' }).then(r => (r.ok ? r.json() : 'kidsroom')) : q.get('layout') ?? 'kidsroom';
    const view = q.get('view') ?? 'chase';
    const quality = q.get('quality') ?? 'high';
    const at = parseFloat(q.get('at') ?? '0.02');
    await document.fonts.load('40px Bangers').catch(() => {});

    const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance', preserveDrawingBuffer: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFShadowMap;
    document.getElementById('stage').appendChild(renderer.domElement);
    const pipeline = new ComicPipeline(renderer, { quality });
    pipeline.enabled = q.get('comic') !== '0';

    const t0 = performance.now();
    const world = await buildWorld({ layout, timeOfDay: q.get('time') ?? 'day', quality });
    const built = performance.now() - t0;
    const track = world.track;
    const camera = new THREE.PerspectiveCamera(view === 'top' ? 40 : 62, innerWidth / innerHeight, 0.5, 1400);
    const b = track.bounds;
    const focus = new THREE.Vector3();
    const extra = window.__extra = new THREE.Group();
    world.scene.add(extra);
    function place(time) {
        if (view === 'top') {
            camera.position.set(b.cx, Math.max(b.sizeX, b.sizeZ) * 1.25, b.cz + 1);
            camera.lookAt(b.cx, 0, b.cz);
            focus.set(b.cx, 0, b.cz);
        } else if (view === 'orbit') {
            // a drone above the road: over the track nothing stands in the way (indoor worlds are full of shelves, beams and furniture)
            const s = ((at + time * 26 / track.length) % 1 + 1) % 1;
            const i = Math.floor(s * track.count);
            const p = track.pointAt(i);
            const ahead = track.pointAt(i + 45);
            camera.position.set(p.x, p.y + 15, p.z);
            camera.lookAt(ahead.x, ahead.y, ahead.z);
            focus.set(ahead.x, ahead.y, ahead.z);
        } else {
            const speed = parseFloat(q.get('speed') ?? '0');
            const s = ((at + time * speed / track.length) % 1 + 1) % 1;
            const i = Math.floor(s * track.count);
            const p = track.pointAt(i);
            const ahead = track.pointAt(i + 14);
            const back = track.pointAt(i - 9);
            camera.position.set(back.x, back.y + 4.2, back.z);
            camera.lookAt(ahead.x, ahead.y + 1.0, ahead.z);
            focus.set(p.x, p.y, p.z);
        }
    }
    addEventListener('resize', () => {
        renderer.setSize(innerWidth, innerHeight);
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
    });
    let frames = 0;
    let last = performance.now();
    const timer = new THREE.Timer();
    function loop() {
        timer.update(); const dt = Math.min(0.05, timer.getDelta());
        const t = timer.getElapsed();
        place(t);
        world.update(dt, t, focus);
        pipeline.render(world.scene, camera, { time: t });
        frames++;
        const now = performance.now();
        if (now - last > 1000) {
            document.getElementById('info').textContent = `${track.key} · ${track.length.toFixed(0)} u · ${track.count} samples · build ${built.toFixed(0)} ms · ${frames} fps · calls ${renderer.info.render.calls} · tris ${(renderer.info.render.triangles / 1000).toFixed(0)}k`;
            frames = 0;
            last = now;
        }
        requestAnimationFrame(loop);
    }
    window.__world = world;
    window.__ready = true;
    loop();
</script>
</body>
</html>
